name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  GO_VERSION: "1.22"
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "starttech-backend"
  WORKING_DIR: "./backend/MuchToDo"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Test & Quality
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Test & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Verify go.mod tidy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (
            echo "go.mod not tidy. Run 'go mod tidy'"
            exit 1
          )

      - name: Run unit tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go test -v -race -coverprofile=coverage.out ./... 2>&1 | tee test_output.txt

          go tool cover -html=coverage.out -o coverage.html

          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')

          echo "Total coverage: $COVERAGE"
          echo "coverage=$COVERAGE" >> $GITHUB_ENV

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage.html

      - name: Run go vet
        working-directory: ${{ env.WORKING_DIR }}
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        working-directory: ${{ env.WORKING_DIR }}
        run: staticcheck ./...
        continue-on-error: true

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: "-exclude-dir=docs ./..."
          working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────
  # Build & Push Docker Image
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
        continue-on-error: true

      - name: Push image to ECR
        run: |
          docker push ${{ steps.meta.outputs.image_uri }}

          docker tag \
            ${{ steps.meta.outputs.image_uri }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          echo "Pushed: ${{ steps.meta.outputs.image_uri }}"

  # ──────────────────────────────────────────────────────────────────────
  # Deploy
  # ──────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 via ASG Rolling Update
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ──────────────────────────────────────────────────────────────
      # Create new Launch Template version
      # ──────────────────────────────────────────────────────────────
      - name: Update Launch Template
        id: update_lt
        run: |
          set -e

          # Get Launch Template ID
          LT_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateId' \
            --output text)

          echo "Launch Template ID: $LT_ID"

          # Get latest version
          LATEST_VERSION=$(aws ec2 describe-launch-templates \
            --launch-template-ids "$LT_ID" \
            --query 'LaunchTemplates[0].LatestVersionNumber' \
            --output text)

          echo "Latest Version: $LATEST_VERSION"

          # Export current launch template data
          aws ec2 describe-launch-template-versions \
            --launch-template-id "$LT_ID" \
            --versions "$LATEST_VERSION" \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData' \
            --output json > lt-data.json

          cat lt-data.json

          # Create new version
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LT_ID" \
            --source-version "$LATEST_VERSION" \
            --launch-template-data file://lt-data.json \
            --version-description "deploy-${{ github.sha }}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "New LT version: $NEW_VERSION"

          echo "lt_id=$LT_ID" >> $GITHUB_OUTPUT
          echo "lt_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ──────────────────────────────────────────────────────────────
      # Point ASG to latest LT version
      # ──────────────────────────────────────────────────────────────
      - name: Update ASG Launch Template Version
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
            --launch-template \
            "LaunchTemplateId=${{ steps.update_lt.outputs.lt_id }},Version=${{ steps.update_lt.outputs.lt_version }}"

      # ──────────────────────────────────────────────────────────────
      # Rolling deployment
      # ──────────────────────────────────────────────────────────────
      - name: Start Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 60,
              "CheckpointPercentages": [50,100],
              "CheckpointDelay": 30
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Refresh ID: $REFRESH_ID"

          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"

          echo "Monitoring refresh: $REFRESH_ID"

          for i in $(seq 1 40); do

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            PCT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text 2>/dev/null || echo "0")

            echo "[$i/40] Status=$STATUS Progress=${PCT}%"

            case "$STATUS" in
              Successful)
                echo "Deployment successful"
                exit 0
                ;;

              Failed|Cancelled)
                echo "Deployment failed"

                aws autoscaling rollback-instance-refresh \
                  --auto-scaling-group-name "${{ secrets.ASG_NAME }}" || true

                exit 1
                ;;
            esac

            sleep 30
          done

          echo "Deployment timed out"
          exit 1

      # ──────────────────────────────────────────────────────────────
      # Health check
      # ──────────────────────────────────────────────────────────────
      - name: Health check via ALB
        run: |
          ALB_URL="http://${{ secrets.ALB_DNS_NAME }}"

          echo "Running health checks against $ALB_URL"

          for i in $(seq 1 10); do

            HTTP_CODE=$(curl -sf -o /dev/null \
              -w "%{http_code}" \
              "$ALB_URL/health" || echo "000")

            echo "Attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi

            sleep 10
          done

          echo "Health check failed"
          exit 1

      # ──────────────────────────────────────────────────────────────
      # Deployment Summary
      # ──────────────────────────────────────────────────────────────
      - name: Write deployment summary
        run: |
          echo "## Backend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ needs.build.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ASG: \`${{ secrets.ASG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Strategy: Rolling Update" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
